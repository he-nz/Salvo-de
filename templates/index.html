<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Downloader Web</title>
  <!-- Para Flask -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Salvo-De</h1>
    
    <!-- FORMULÁRIO -->
    <form id="downloadForm">
      <label>URL:</label>
      <input type="text" name="url" placeholder="Cole o link aqui..." required>

      <label>Formato:</label>
      <select name="format">
        <option value="video">Vídeo</option>
        <option value="audio">Áudio (MP3)</option>
      </select>

      <label>Qualidade:</label>
      <select name="quality">
        <option value="best">Melhor disponível</option>
        <option value="medium">Qualidade média</option>
        <option value="low">Qualidade baixa</option>
      </select>

      <button type="submit">Baixar</button>
    </form>

    <div id="status">Aguardando…</div>
    <div id="link"></div>
  </div>

  <script>
    document.getElementById("downloadForm").onsubmit = async function(e){
      e.preventDefault();
      const formData = new FormData(this);
      document.getElementById("status").innerText = "Baixando...";

      try {
        let resp = await fetch("/download", { method:"POST", body:formData });
        let result = await resp.json();

        if(result.status === "ok"){
          document.getElementById("status").innerText = result.message;
          document.getElementById("link").innerHTML =
            `<a href="/getfile?file=${encodeURIComponent(result.file)}">Clique aqui para baixar o arquivo</a>`;
        } else {
          document.getElementById("status").innerText = "Erro: " + result.message;
        }
      } catch (err) {
        document.getElementById("status").innerText = "Erro de conexão.";
      }
    }
  </script>
</body>
</html>
